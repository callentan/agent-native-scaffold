[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddd-scaffold"
version = "0.1.0"
description = "Installer and updater for the DDD scaffold"
requires-python = ">=3.11"

[project.scripts]
ddd-scaffold = "ddd_scaffold.cli:main"

[tool.setuptools.packages.find]
where = ["cli"]
include = ["ddd_scaffold*"]
