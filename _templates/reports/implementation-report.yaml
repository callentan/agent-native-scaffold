# Blank output form for the implementation summary; not another run input/result ledger.
# Field contract: ../../.github/contracts/README.md#implementation-report
# Collection interface: ../../.github/utilities/README.md#implementation-report
# A formal report should be rebuilt read-only from an explicit Git object and existing VT runs; do not copy statuses by hand.
# Every placeholder must be replaced with real input; this form does not mean the configuration is valid, a run happened, or acceptance passed.
schemaVersion: 1
scope: "PROJECT/CTX-NNN"
object:
  root: .
  baseline: "<full-tested-commit>"
bcConfig:
  reference: bc-config.yaml
  baseline: "<same-tested-commit>"
domainSources: []
artifactRefs: []
entries:
  - target: "PROJECT/CTX-NNN/SR-NNN#sr-nnn-ac-01"
    codeRefs: []
    testRefs: []
    execution:
      status: not-run
      evidenceRefs: []
      reason: "No VT run record belonging to this target has been selected and checked yet."
    applicability:
      state: unverified
      reason: "No independent applicability review record matching the run, target, and baseline exists yet."
# The scope, complete acceptance inventory, BC/domain sources, code/test locations, and evidence must all trace back to their sources.
# Real targets without evidence must still be kept; do not copy only the single entry above or targets that already succeeded.
# The report has no root-level execution or views; the nine views belong to the model, and actual results belong to the original VT or report.
