# Optional data form; not an application manifest or an executable command.
# Guide: ../../architecture/README.md#bc-configuration
# Contract: ../../.github/contracts/bc-config.schema.json
# Optional local preflight and explicit operations: ../../docs/domain-sources.md
# Copy to bc-config.yaml in the authorized project root, then fill in each item; no placeholder is a confirmed fact.
schemaVersion: 1
projectId: "PROJECT-TODO"
boundedContexts:
  - id: "CTX-TODO"
domainSources:
  - id: "SOURCE-TODO"
    kind: "<local-or-git>"
    root: "<explicit-source-root>"
    path: "<repo-relative-source-path>"
    baseline: "<full-fixed-git-object-or-sha256-digest>"
    readOnly: true
# This currently points to the blank development registration; a readable path does not mean the application or its commands are configured.
developmentRegistration: docs/development.md#project-registration
# Check root and path separately; for a git source, enter only an actual full Git object, not HEAD, a branch, or an abbreviation.
# A local source may use an actual sha256:<digest>; with no domain source, use an empty list only with an explicit basis.
# readOnly describes the nature of the material; it does not grant write permission. Do not add commands or credentials, or copy application configuration.
# Filling in the form does not trigger clone/update/submodule/commit; if the path/source/baseline is unverified, stop actions that depend on it.
# register only maintains the explicit list of existing BC sources and does not overwrite non-empty domain directories.
# Submodule materialization is separate from registration; the local target and the index each need separate consent; it makes no network requests and implies no commit.
